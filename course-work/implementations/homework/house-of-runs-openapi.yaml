      - BearerAuth: []
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: custom token
      description: 'Send the access token returned by /api/auth/login or /api/auth/register as Authorization: Bearer {token}.'
  schemas:
    ProblemDetails:
      type: object
      description: Standardized RFC 7807-style error response used by global exception handling and validation failures. Raw
        stack traces are not returned.
      properties:
        type:
          type: string
          nullable: true
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
          nullable: true
        instance:
          type: string
          nullable: true
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Optional model validation errors.
    RegisterRequest:
      type: object
      required:
      - userName
      - email
      - displayName
      - password
      properties:
        userName:

  /api/import/run-draft:
    post:
      tags:
      - Import
      summary: Import one run draft
      description: 'Accepts a non-empty .json file exported by the Hades run-history mod and returns one editable run draft.
        If runIndex is supplied, that run index is imported; otherwise the latest run is selected. Size limit: 2 MB. During
        parsing the service maps weapon/aspect, result, heat, duration, biomes and boons, and may create missing lookup records
        server-side. The importer accepts the ExportRunHistory JSON shape with runs[index,result,time,clearMessage,weapon,aspect,keepsake,companion,trait,heat,darkness].
        Trait rarity is stored as Unknown because the export does not include rarity.'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImportRunDraftRequest'
      responses:
        '200':
          description: Generated run draft.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportRunDraftResponse'
        '400':
          description: Invalid, empty, non-JSON or unparsable file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Missing or invalid token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - BearerAuth: []
  /api/import/run-drafts:
    post:
      tags:
      - Import
      summary: Import all run drafts
      description: 'Accepts a non-empty .json ExportRunHistory file and returns all runs as editable drafts ordered by import
        index descending. Size limit: 8 MB. The importer accepts the ExportRunHistory JSON shape with runs[index,result,time,clearMessage,weapon,aspect,keepsake,companion,trait,heat,darkness].
        Trait rarity is stored as Unknown because the export does not include rarity.'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImportRunsDraftRequest'
      responses:
        '200':
          description: Generated run draft list.
          content:

  /api/runs:
    get:
      tags:
      - Runs
      summary: List runs
      description: Returns a paged, sorted, filtered list of runs. Requires authenticated user.
      parameters:
      - name: q
        in: query
        required: false
        description: Searches title, notes, user name and weapon/aspect names.
        schema:
          type: string
          maxLength: 120
      - name: userId
        in: query
        required: false
        description: Admin filter by owner user id; ignored for normal users.
        schema:
          type: string
          format: uuid
      - name: weaponId
        in: query
        required: false
        description: Filters by weapon id.
        schema:
          type: string
          format: uuid
      - name: result
        in: query
        required: false
        description: Filters by run result.
        schema:
          type: string
          maxLength: 20
          enum:
          - Escaped
          - Died
      - name: finalBiome
        in: query
        required: false
        description: Filters by final biome.
        schema:
          type: string
          maxLength: 40
      - name: minHeat
        in: query
        required: false
        description: Minimum heat level.
        schema:
          type: integer
          minimum: 0
          maximum: 64
      - name: maxHeat
        in: query
        required: false
        description: Maximum heat level.
        schema:
          type: integer
          minimum: 0
          maximum: 64
      - name: mineOnly
        in: query
        required: false
        description: When true, returns only the current user's runs. Normal users are always restricted to their own runs.
        schema:
          type: boolean
          default: false
      - name: page
        in: query
        required: false
        description: 1-based page number. Values below 1 are normalized to 1.
        schema:
          type: integer
          minimum: 1
          default: 1

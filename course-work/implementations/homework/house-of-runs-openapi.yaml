openapi: 3.0.3
info:
  title: House of Runs API
  version: 1.0.0
  description: OpenAPI documentation for the House of Runs coursework system. The system manages Hades escape attempts, users,
    weapons, boons, run-boon relationships, authentication, role-based administration, and JSON import of run-history files.
    All protected services use token authentication, async database access, centralized Problem Details errors, filtering,
    sorting, and pagination where a list is returned. Hades save file data is imported using a Mod (https://www.nexusmods.com/hades/mods/54?tab=description), localization/translation (to be implemented) uses the games own mapping sjson files language files so it should be seemless. Main idea of the project is sharing builds/achievements/challanges between players, as well as manually edited crazy run scenarios.               - Vasil Kirov FacN:2401321072
servers:
- url: http://localhost:5119
  description: Local HTTP backend
tags:
- name: Auth
  description: Registration, login and current-user profile services.
- name: Users
  description: Admin-only user management CRUD services.
- name: Weapons
  description: Admin-only weapon/aspect lookup CRUD services.
- name: Boons
  description: Admin-only boon lookup CRUD services.
- name: Runs
  description: Run CRUD services. Normal users manage only their own runs; administrators can manage all runs.
- name: RunBoons
  description: CRUD services for the many-to-many relationship between runs and boons.
- name: Import
  description: JSON import services for Hades ExportRunHistory files.
- name: TraitLocalizations
  description: Services for resolving raw Hades trait identifiers from ExportRunHistory/CodexText files to display-friendly
    names.
- name: ClearMessages
  description: Services for clear-message metadata and GameStateRequirements imported from RunClearMessageData.lua.
paths:
  /api/auth/register:
    post:
      tags:
      - Auth
      summary: Register user
      description: Creates a normal User account. Validates unique email and username, email format, required fields, text
        lengths and password length. Returns an authentication token and profile data.
      requestBody:
        description: Request payload.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: Registration successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Email or username already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/auth/login:
    post:
      tags:
      - Auth
      summary: Login
      description: Authenticates with email or username plus password. Inactive accounts and wrong credentials return 401
        without exposing password details.
      requestBody:
        description: Request payload.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Invalid credentials or inactive user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/auth/me:
    get:
      tags:
      - Auth
      summary: Current user
      description: Returns the profile represented by the current bearer token.
      responses:
        '200':
          description: Current user profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Missing, invalid or expired token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - BearerAuth: []
  /api/users:
    get:
      tags:
      - Users
      summary: List users
      description: Returns a paged, sorted, filtered list of users. Requires Admin role.
      parameters:
      - name: q
        in: query
        required: false
        description: Searches username, display name and bio.
        schema:
          type: string
          maxLength: 120
      - name: email
        in: query
        required: false
        description: Filters by email substring.
        schema:
          type: string
          maxLength: 120
      - name: isActive
        in: query
        required: false
        description: Filters active/inactive accounts.
        schema:
          type: boolean
      - name: page
        in: query
        required: false
        description: 1-based page number. Values below 1 are normalized to 1.
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: pageSize
        in: query
        required: false
        description: Number of records per page. Server clamps values to the range 1..50.
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 10
      - name: sortBy
        in: query
        required: false
        description: Field used for sorting. Unsupported values fall back to the default sort field.
        schema:
          type: string
      - name: sortDir
        in: query
        required: false
        description: Sort direction.
        schema:
          type: string
          enum:
          - asc
          - desc
          default: asc
      responses:
        '200':
          description: Paged list response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedUserResponse'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Missing or invalid token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Insufficient role or ownership.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - BearerAuth: []
    post:
      tags:
      - Users
      summary: Create user
      description: Creates a new users resource after validating all required fields, max lengths and numeric ranges. Requires
        Admin role.
      requestBody:
        description: Request payload.
        required: true
        content:

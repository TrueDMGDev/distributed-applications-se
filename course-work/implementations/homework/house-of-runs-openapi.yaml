      - Import
      summary: Validate ExportRunHistory JSON
      description: Validates the raw output.json structure before creating run drafts. Checks that runs is present, index
        values are positive, time uses mm:ss.ff format, trait entries include traitName and traitLevel, and heat/darkness
        arrays are structurally valid.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportRunHistoryFile'
      responses:
        '200':
          description: Validation succeeded.
          content:
            application/json:
              schema:
                type: object
                required:
                - isValid
                - runCount
                properties:
                  isValid:
                    type: boolean
                  runCount:
                    type: integer
                  warnings:
                    type: array
                    items:
                      type: string
